# 推送到 main 时部署到 Cloudflare：测试 → 确保 D1 存在 → 数据库迁移 → 构建 → 部署。
# 需要的仓库配置见 README“部署”。
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 仓库还没配置 Access 变量时跳过（而不是报错），见 README“部署”
    if: ${{ vars.ACCESS_AUD != '' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      # 可选：邮件导入
      INBOUND_EMAIL: ${{ vars.INBOUND_EMAIL }}
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure wrangler (D1 id, Access vars)
        run: node scripts/ci-configure.mjs
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply flighttracker --remote
      - run: npm run build
      - name: Deploy Worker
        run: npx wrangler deploy
      # 密钥只交给这一步，不暴露给安装依赖、测试和构建
      - name: Set Claude API key (optional, for email import)
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
