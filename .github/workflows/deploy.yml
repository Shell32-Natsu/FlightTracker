# 推送到 main 时部署到 Cloudflare：测试 → 确保 D1 存在 → 数据库迁移 → 构建 → 部署。
# 需要的仓库配置见 README“部署”。
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 仓库还没配置 Access 变量时跳过（而不是报错），见 README“部署”
    if: ${{ vars.ACCESS_AUD != '' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure wrangler (D1 id, Access vars)
        run: node scripts/ci-configure.mjs
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply flighttracker --remote
      - run: npm run build
      - name: Deploy Worker
        run: npx wrangler deploy
