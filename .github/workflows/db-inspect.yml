# 手动运行：只读查看线上 D1 的数据归属统计，用于排查。
# 仓库公开、日志公开，所以只输出计数，不输出邮箱或用户 ID。
name: Inspect D1 (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ci-configure.mjs
      - name: Counts
        run: |
          npx wrangler d1 execute flighttracker --remote --json --command "
            SELECT
              (SELECT count(*) FROM users) AS users,
              (SELECT count(*) FROM flights) AS flights_total,
              (SELECT count(*) FROM flights WHERE user_id = 'legacy') AS legacy_flights,
              (SELECT count(*) FROM settings WHERE user_id = 'legacy') AS legacy_settings,
              (SELECT count(DISTINCT user_id) FROM flights) AS flight_owners;
            SELECT
              row_number() OVER (ORDER BY u.created_at, u.id) AS user_no,
              u.created_at,
              (SELECT count(*) FROM flights f WHERE f.user_id = u.id) AS flights,
              (SELECT count(*) FROM settings s WHERE s.user_id = u.id) AS settings
            FROM users u ORDER BY u.created_at, u.id;"
